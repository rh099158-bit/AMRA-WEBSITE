<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amra Shop</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#222;
}

header{
  background:#0866ff;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:32px;
}

.search{
  padding:15px;
  background:white;
  position:sticky;
  top:0;
  z-index:5;
}

.search input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:25px;
  font-size:16px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.hero{
  background:white;
  padding:25px;
  border-radius:15px;
  margin-bottom:20px;
  text-align:center;
}

.hero h2{
  color:#0866ff;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.product{
  background:white;
  border-radius:15px;
  padding:12px;
  box-shadow:0 2px 8px #ddd;
}

.product img{
  width:100%;
  height:170px;
  object-fit:cover;
  border-radius:10px;
}

.product h3{
  margin:10px 0 5px;
}

.price{
  font-size:20px;
  font-weight:bold;
  color:#e53935;
}

button{
  width:100%;
  border:0;
  border-radius:8px;
  padding:12px;
  margin-top:8px;
  background:#0866ff;
  color:white;
  font-size:16px;
}

.cart{
  background:#fff;
  padding:20px;
  margin-top:20px;
  border-radius:15px;
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
}

@media(max-width:500px){
  .products{
    grid-template-columns:1fr 1fr;
  }

  .product img{
    height:130px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🛍️ Amra Shop</h1>
  <p>ভালো পণ্য, ভালো দাম ❤️</p>
</header>

<div class="search">
  <input type="text" id="search" placeholder="🔎 পণ্য খুঁজুন..." onkeyup="searchProducts()">
</div>

<div class="container">

  <div class="hero">
    <h2>Amra-তে স্বাগতম!</h2>
    <p>আপনার পছন্দের পণ্য সহজে খুঁজে নিন।</p>
  </div>

  <h2>🔥 জনপ্রিয় পণ্য</h2>

  <div class="products" id="products">

    <div class="product">
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Watch">
      <h3>স্মার্ট ওয়াচ</h3>
      <div class="price">৳1,499</div>
      <button onclick="addCart('স্মার্ট ওয়াচ')">🛒 কার্টে যোগ করুন</button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=500" alt="Headphone">
      <h3>ওয়্যারলেস হেডফোন</h3>
      <div class="price">৳1,199</div>
      <button onclick="addCart('ওয়্যারলেস হেডফোন')">🛒 কার্টে যোগ করুন</button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1600080972464-8e5f35f63d08?w=500" alt="Bag">
      <h3>ফ্যাশন ব্যাগ</h3>
      <div class="price">৳899</div>
      <button onclick="addCart('ফ্যাশন ব্যাগ')">🛒 কার্টে যোগ করুন</button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Earphone">
      <h3>ব্লুটুথ ইয়ারফোন</h3>
      <div class="price">৳699</div>
      <button onclick="addCart('ব্লুটুথ ইয়ারফোন')">🛒 কার্টে যোগ করুন</button>
    </div>

  </div>

  <div class="cart">
    <h2>🛒 আমার কার্ট</h2>
    <p id="cartText">আপনার কার্ট এখন খালি।</p>
  </div>

</div>

<footer>
  © 2026 Amra Shop — All Rights Reserved
</footer>

<script>

let cart=[];

function addCart(product){
  cart.push(product);
  document.getElementById("cartText").innerText =
    "কার্টে যোগ হয়েছে: " + cart.join(", ");
  alert(product + " কার্টে যোগ হয়েছে ✅");
}
