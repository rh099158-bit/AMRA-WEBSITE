<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amra Social</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f2f5;font-family:Arial,sans-serif;color:#222}
header{background:#0866ff;color:white;padding:18px;font-size:28px;font-weight:bold}
nav{background:white;padding:14px;display:flex;justify-content:space-around;box-shadow:0 2px 5px #ccc}
nav a{color:#0866ff;text-decoration:none;font-weight:bold}
main{max-width:600px;margin:20px auto;padding:10px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:16px;box-shadow:0 1px 4px #ddd}
input,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin:8px 0;font-size:16px}
button{background:#0866ff;color:white;border:0;border-radius:8px;padding:12px 18px;font-size:16px;cursor:pointer}
.post{white-space:pre-wrap;overflow-wrap:anywhere}
small{color:#777}
</style>
</head>
<body>
<header>Amra</header>
<nav>
<a href="#">হোম</a>
<a href="#create">পোস্ট</a>
<a href="#about">আমরা</a>
</nav>
<main>
<div class="card">
<h2>স্বাগতম Amra-তে! 💙</h2>
<p>বন্ধুদের সঙ্গে যুক্ত হও, মনের কথা শেয়ার করো।</p>
</div>
<div class="card" id="create">
<h3>নতুন পোস্ট তৈরি করো</h3>
<textarea id="message" placeholder="তুমি কী ভাবছো?"></textarea>
<button onclick="addPost()">পোস্ট করো</button>
</div>
<div id="posts"></div>
<div class="card" id="about">
<h3>Amra Social</h3>
<p>একসঙ্গে আমরা—এটাই Amra। ❤️</p>
<small>Amra-এর প্রথম সংস্করণ</small>
</div>
</main>
<script>
function addPost(){
const box=document.getElementById('message');
const value=box.value.trim();
if(!value){alert('আগে কিছু লিখো!');return;}
const card=document.createElement('div');
card.className='card post';
card.textContent=value;
document.getElementById('posts').prepend(card);
box.value='';
}
</script>
</body>
</html>
